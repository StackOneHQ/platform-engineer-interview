name: CI

on:
  pull_request:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      # Only test packages changed since main — cuts most PRs from ~35 min to a couple.
      - run: pnpm turbo run test --filter='{./packages/billing}[origin/main]'
      - run: pnpm turbo run build

  # Advisory only — surfaces lint annotations inline without blocking the merge.
  annotations:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint -- --format stylish

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - uses: some-org/deploy-action@main
      - name: Deploy all stacks
        run: |
          set -x
          export DATABASE_URL="postgres://acme_core_admin:${{ secrets.CORE_DB_PASSWORD }}@acme-core-prod.cluster-CHANGEME.eu-west-2.rds.amazonaws.com:5432/core"
          pnpm --filter infra exec cdk deploy '*' --require-approval never
