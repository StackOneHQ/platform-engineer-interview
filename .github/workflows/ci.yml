name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      # Full monorepo test suite on every PR. Slow (~35 min) but thorough.
      - run: pnpm turbo run test
      - run: pnpm turbo run build

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: warp-ubuntu-latest-x64-2x
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Federated OIDC into the deploy role — no long-lived AWS keys in CI.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::CHANGEME:role/gha-deploy
          aws-region: eu-west-2
      - run: pnpm --filter infra exec cdk diff
      - run: pnpm --filter infra exec cdk deploy --all --require-approval any-change
